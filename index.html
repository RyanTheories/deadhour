<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DEADHOUR — Proof of Concept</title>
<style>
  html, body { margin: 0; padding: 0; background: #0d0f14; height: 100%; overflow: hidden; }
  canvas { display: block; margin: 0 auto; }
  #wrap { position: relative; width: 960px; height: 600px; margin: 0 auto; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="600"></canvas></div>
<script>
"use strict";
// DEADHOUR — Build 0 proof-of-concept
// Top-down shooter with bullet time. See design doc §3.

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

// ---------- Pre-rendered painterly assets ----------
// Floor texture: dark base with visible brush strokes and speckle, per the
// style board's painterly noir surfaces.
const floorTex = document.createElement("canvas");
floorTex.width = W; floorTex.height = H;
{
  const c = floorTex.getContext("2d");
  c.fillStyle = "#0a0d14";
  c.fillRect(0, 0, W, H);
  // broad cool-toned strokes
  for (let i = 0; i < 90; i++) {
    const x = Math.random()*W, y = Math.random()*H;
    const len = 60 + Math.random()*180, ang = Math.random()*Math.PI*2;
    const warm = Math.random() < 0.2;
    c.strokeStyle = warm
      ? `rgba(${60+Math.random()*30|0},${40},${20},${0.04+Math.random()*0.05})`
      : `rgba(${30+Math.random()*20|0},${40+Math.random()*20|0},${60+Math.random()*25|0},${0.05+Math.random()*0.07})`;
    c.lineWidth = 8 + Math.random()*22;
    c.lineCap = "round";
    c.beginPath();
    c.moveTo(x, y);
    c.lineTo(x + Math.cos(ang)*len, y + Math.sin(ang)*len);
    c.stroke();
  }
  // speckle
  for (let i = 0; i < 1400; i++) {
    c.fillStyle = Math.random() < 0.5 ? "rgba(140,150,180,0.05)" : "rgba(0,0,0,0.14)";
    c.fillRect(Math.random()*W, Math.random()*H, 1.5, 1.5);
  }
}

// Skyline backdrop for title / end screens: dark skyscrapers with scattered
// lit windows and a cold glow, matching the style board's night cityscapes.
const skylineTex = document.createElement("canvas");
skylineTex.width = W; skylineTex.height = H;
{
  const c = skylineTex.getContext("2d");
  const sky = c.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#05070d");
  sky.addColorStop(1, "#101826");
  c.fillStyle = sky;
  c.fillRect(0, 0, W, H);
  // cold ambient glow behind the skyline
  const glow = c.createRadialGradient(W/2, H*0.72, 20, W/2, H*0.72, H*0.8);
  glow.addColorStop(0, "rgba(90,120,160,0.18)");
  glow.addColorStop(1, "rgba(90,120,160,0)");
  c.fillStyle = glow;
  c.fillRect(0, 0, W, H);
  // building silhouettes, far then near
  for (let layer = 0; layer < 2; layer++) {
    let x = -20;
    while (x < W + 20) {
      const bw = 50 + Math.random()*110;
      const bh = (layer === 0 ? 180 : 280) + Math.random()*160;
      const by = H - bh;
      c.fillStyle = layer === 0 ? "#0b0f18" : "#070a10";
      c.fillRect(x, by, bw, bh);
      // lit windows
      const cols = Math.floor(bw/14), rows = Math.floor(bh/18);
      for (let wx = 0; wx < cols; wx++) for (let wy = 0; wy < rows; wy++) {
        if (Math.random() < 0.10) {
          c.fillStyle = Math.random() < 0.75 ? "rgba(255,190,90,0.85)" : "rgba(140,215,255,0.8)";
          c.fillRect(x + 4 + wx*14, by + 6 + wy*18, 6, 8);
        }
      }
      x += bw + 4 + Math.random()*14;
    }
  }
  // rooftop figure silhouette (foreground, off-center)
  c.fillStyle = "#04060a";
  c.beginPath();
  c.ellipse(W*0.78, H*0.94, 26, 60, 0, 0, Math.PI*2); c.fill();
  c.beginPath();
  c.arc(W*0.78, H*0.80, 13, 0, Math.PI*2); c.fill();
  // coat tails
  c.beginPath();
  c.moveTo(W*0.78 - 14, H*0.88);
  c.quadraticCurveTo(W*0.78 - 40, H*1.0, W*0.78 - 20, H*1.02);
  c.lineTo(W*0.78 + 14, H*0.9);
  c.closePath(); c.fill();
}

// ---------- Global state ----------
let timescale = 1;            // world timescale, lerped by bullet time
let targetTimescale = 1;
let gameState = "title";      // title | playing | win | lose
let frame = 0;
const keys = {};
const mouse = { x: W/2, y: H/2, down: false, right: false };

canvas.addEventListener("contextmenu", e => e.preventDefault());
window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "KeyR") tryReload();
  if (e.code === "Space") tryDive();
  if (["Space","KeyQ"].includes(e.code)) e.preventDefault();
});
window.addEventListener("keyup", e => keys[e.code] = false);
canvas.addEventListener("mousemove", e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top) * (H / r.height);
});
canvas.addEventListener("mousedown", e => {
  if (e.button === 0) mouse.down = true;
  if (e.button === 2) mouse.right = true;
});
canvas.addEventListener("mouseup", e => {
  if (e.button === 0) mouse.down = false;
  if (e.button === 2) mouse.right = false;
});

// ---------- World / level ----------
// Apartment lobby: walls (rect), cover objects (rect, blockable), lights
const walls = [
  { x: 0, y: 0, w: W, h: 24 },            // top wall
  { x: 0, y: H-24, w: W, h: 24 },         // bottom wall
  { x: 0, y: 0, w: 24, h: H },            // left wall
  { x: W-24, y: 0, w: 24, h: H },         // right wall
  { x: 180, y: 24, w: 24, h: 180 },       // pillar
  { x: 180, y: 396, w: 24, h: 180 },      // pillar
  { x: 756, y: 24, w: 24, h: 180 },       // pillar
  { x: 756, y: 396, w: 24, h: 180 },      // pillar
  { x: 440, y: 0, w: 80, h: 120 },        // doorway alcove wall
];
const covers = [
  { x: 300, y: 150, w: 70, h: 46 },       // crate
  { x: 300, y: 404, w: 70, h: 46 },      // crate
  { x: 590, y: 150, w: 70, h: 46 },      // crate
  { x: 590, y: 404, w: 70, h: 46 },      // crate
  { x: 452, y: 260, w: 56, h: 80 },      // overturned sofa
];
const lights = [
  { x: W/2, y: 90,  r: 260, color: "rgba(255,170,80," },
  { x: W/2, y: 510, r: 260, color: "rgba(255,170,80," },
  { x: 120, y: 300, r: 200, color: "rgba(120,220,255," },  // neon spill
  { x: 840, y: 300, r: 200, color: "rgba(120,220,255," },
];
const allBlockers = walls.concat(covers);

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function circleHitsRects(x, y, r) {
  for (const rect of allBlockers) {
    const cx = Math.max(rect.x, Math.min(x, rect.x + rect.w));
    const cy = Math.max(rect.y, Math.min(y, rect.y + rect.h));
    const dx = x - cx, dy = y - cy;
    if (dx*dx + dy*dy < r*r) return true;
  }
  return false;
}
function moveCirc(obj, dx, dy, r) {
  if (!circleHitsRects(obj.x + dx, obj.y, r)) obj.x += dx;
  if (!circleHitsRects(obj.x, obj.y + dy, r)) obj.y += dy;
}

// ---------- Entities ----------
const player = {
  x: 120, y: 300, r: 14, speed: 260,
  hp: 100, maxHp: 100,
  ammo: 12, mag: 12, reloading: 0, reloadTime: 1.1,
  fireCooldown: 0, fireRate: 0.22,
  diving: false, diveT: 0, diveDir: {x:0,y:0}, diveDur: 0.42,
  btMeter: 1, btActive: false, btDrain: 0.28, btRegen: 0.045,
  aimAngle: 0,
};

let enemies, bullets, particles, decals, pickups, tracers;

function spawnLevel() {
  enemies = [
    { x: 700, y: 120, r: 14, hp: 40, speed: 90, fireCd: 1.4, accuracy: 0.12, state: "advance" },
    { x: 820, y: 480, r: 14, hp: 40, speed: 90, fireCd: 1.7, accuracy: 0.14, state: "advance" },
    { x: 480, y: 90,  r: 14, hp: 40, speed: 90, fireCd: 2.0, accuracy: 0.16, state: "advance" },
    { x: 640, y: 300, r: 14, hp: 40, speed: 90, fireCd: 1.5, accuracy: 0.12, state: "advance" },
  ];
  bullets = [];
  particles = [];
  decals = [];
  tracers = [];
  pickups = [
    { x: 480, y: 520, r: 10, taken: false },
    { x: 880, y: 300, r: 10, taken: false },
  ];
}

// ---------- Player actions ----------
function tryReload() {
  if (gameState !== "playing" || player.reloading > 0 || player.ammo === player.mag) return;
  player.reloading = player.reloadTime;
}
function tryDive() {
  if (gameState !== "playing" || player.diving) return;
  let dx = (keys.KeyD?1:0) - (keys.KeyA?1:0);
  let dy = (keys.KeyS?1:0) - (keys.KeyW?1:0);
  if (!dx && !dy) { dx = Math.cos(player.aimAngle); dy = Math.sin(player.aimAngle); }
  const len = Math.hypot(dx, dy);
  player.diving = true;
  player.diveT = player.diveDur;
  player.diveDir = { x: dx/len, y: dy/len };
}

function playerShoot() {
  if (player.reloading > 0 || player.fireCooldown > 0 || player.ammo <= 0) return;
  player.ammo--;
  player.fireCooldown = player.fireRate;
  const a = player.aimAngle + (Math.random()-0.5)*0.03;
  bullets.push({ x: player.x + Math.cos(a)*18, y: player.y + Math.sin(a)*18,
                 dx: Math.cos(a), dy: Math.sin(a), speed: 1500, life: 1.0, friendly: true });
  spawnMuzzleFlash(player.x + Math.cos(a)*20, player.y + Math.sin(a)*20, a);
  shake = Math.min(shake + 2, 6);
  if (player.ammo === 0) tryReload();
}

// ---------- Enemies ----------
function enemyShoot(en) {
  const a = Math.atan2(player.y - en.y, player.x - en.x) + (Math.random()-0.5)*en.accuracy*4;
  bullets.push({ x: en.x + Math.cos(a)*18, y: en.y + Math.sin(a)*18,
                 dx: Math.cos(a), dy: Math.sin(a), speed: 1100, life: 1.0, friendly: false });
  spawnMuzzleFlash(en.x + Math.cos(a)*20, en.y + Math.sin(a)*20, a);
}

function updateEnemy(en, dt) {
  const toP = Math.atan2(player.y - en.y, player.x - en.x);
  const dist = Math.hypot(player.x - en.x, player.y - en.y);
  en.fireCd -= dt;
  if (dist > 240) {
    moveCirc(en, Math.cos(toP)*en.speed*dt, Math.sin(toP)*en.speed*dt, en.r);
  } else {
    // strafe a little
    const perp = toP + Math.PI/2 * (en.strafeDir || (en.strafeDir = Math.random() < 0.5 ? 1 : -1));
    moveCirc(en, Math.cos(perp)*en.speed*0.5*dt, Math.sin(perp)*en.speed*0.5*dt, en.r);
  }
  if (en.fireCd <= 0 && dist < 420) {
    enemyShoot(en);
    en.fireCd = 1.2 + Math.random()*0.8;
  }
}

// ---------- Effects ----------
let shake = 0;
function spawnMuzzleFlash(x, y, angle) {
  particles.push({ type: "flash", x, y, angle, life: 0.07, maxLife: 0.07 });
}
function spawnBlood(x, y) {
  for (let i = 0; i < 8; i++) {
    const a = Math.random()*Math.PI*2, s = 40 + Math.random()*120;
    particles.push({ type: "blood", x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.5, maxLife: 0.5 });
  }
  decals.push({ x: x + (Math.random()-0.5)*20, y: y + (Math.random()-0.5)*20, r: 5 + Math.random()*9 });
}
function spawnRainSplash(x, y) {
  particles.push({ type: "splash", x, y, life: 0.25, maxLife: 0.25 });
}

// rain drops (visual only)
const rain = [];
for (let i = 0; i < 120; i++) {
  rain.push({ x: Math.random()*W, y: Math.random()*H, len: 10 + Math.random()*14, speed: 700 + Math.random()*300 });
}

// ---------- Update ----------
function update(rawDt) {
  // bullet time toggle
  const wantBT = (keys.KeyQ || mouse.right) && player.btMeter > 0 && !player.diving;
  player.btActive = wantBT;
  targetTimescale = wantBT ? 0.25 : 1;
  timescale += (targetTimescale - timescale) * Math.min(1, rawDt * 8);
  if (wantBT) player.btMeter = Math.max(0, player.btMeter - player.btDrain * rawDt);
  else player.btMeter = Math.min(1, player.btMeter + player.btRegen * rawDt);

  const dt = rawDt * timescale;      // world time
  const pDt = rawDt * (wantBT ? 0.4 : 1); // player edge in bullet time

  frame++;
  shake = Math.max(0, shake - rawDt*20);

  // aim
  player.aimAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

  // movement
  if (player.diving) {
    player.diveT -= pDt;
    moveCirc(player, player.diveDir.x * 520 * pDt, player.diveDir.y * 520 * pDt, player.r);
    if (player.diveT <= 0) player.diving = false;
  } else {
    let dx = (keys.KeyD?1:0) - (keys.KeyA?1:0);
    let dy = (keys.KeyS?1:0) - (keys.KeyW?1:0);
    if (dx || dy) {
      const len = Math.hypot(dx, dy);
      moveCirc(player, dx/len * player.speed * pDt, dy/len * player.speed * pDt, player.r);
    }
  }

  // shooting / reload
  player.fireCooldown -= pDt;
  if (player.reloading > 0) {
    player.reloading -= pDt;
    if (player.reloading <= 0) player.ammo = player.mag;
  }
  if (mouse.down && !player.diving) playerShoot();

  // pickups
  for (const p of pickups) {
    if (!p.taken && Math.hypot(player.x - p.x, player.y - p.y) < player.r + p.r + 4) {
      p.taken = true;
      player.hp = Math.min(player.maxHp, player.hp + 50);
    }
  }

  // enemies
  for (const en of enemies) if (en.hp > 0) updateEnemy(en, dt);

  // bullets
  for (const b of bullets) {
    const steps = 3;
    for (let s = 0; s < steps && b.life > 0; s++) {
      b.x += b.dx * b.speed * dt / steps;
      b.y += b.dy * b.speed * dt / steps;
      if (b.x < 0 || b.x > W || b.y < 0 || b.y > H) b.life = 0;
      for (const rect of allBlockers) {
        if (b.x > rect.x && b.x < rect.x + rect.w && b.y > rect.y && b.y < rect.y + rect.h) {
          b.life = 0;
          if (Math.random() < 0.5) decals.push({ x: b.x, y: b.y, r: 2 });
          break;
        }
      }
      if (b.life > 0 && b.friendly) {
        for (const en of enemies) {
          if (en.hp > 0 && Math.hypot(b.x - en.x, b.y - en.y) < en.r + 2) {
            en.hp -= 34;
            spawnBlood(b.x, b.y);
            b.life = 0;
            if (en.hp <= 0) {
              player.btMeter = Math.min(1, player.btMeter + 0.35); // adrenaline refill
              hitStop = 0.06;
            }
            break;
          }
        }
      } else if (b.life > 0) {
        const hitR = player.diving ? player.r * 0.5 : player.r;
        if (Math.hypot(b.x - player.x, b.y - player.y) < hitR + 2) {
          player.hp -= 22;
          spawnBlood(b.x, b.y);
          shake = 6;
          b.life = 0;
        }
      }
    }
    b.life -= pDt;
    tracers.push({ x1: b.x - b.dx*26, y1: b.y - b.dy*26, x2: b.x, y2: b.y, life: 0.06 });
  }
  bullets = bullets.filter(b => b.life > 0);

  // particles
  for (const p of particles) {
    p.life -= dt;
    if (p.type === "blood") { p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.92; p.vy *= 0.92; }
  }
  particles = particles.filter(p => p.life > 0);
  for (const t of tracers) t.life -= rawDt;
  tracers = tracers.filter(t => t.life > 0);

  // rain
  for (const d of rain) {
    d.y += d.speed * dt;
    d.x += 60 * dt;
    if (d.y > H) { d.y = -20; d.x = Math.random()*W; }
    if (d.x > W) d.x = 0;
    if (frame % 4 === 0 && Math.random() < 0.02) spawnRainSplash(d.x, d.y);
  }

  // hit-stop
  if (hitStop > 0) { hitStop -= rawDt; return; }

  // win / lose
  if (enemies.every(e => e.hp <= 0)) gameState = "win";
  else if (player.hp <= 0) gameState = "lose";
}
let hitStop = 0;

// ---------- Render ----------
function drawTitleScreen() {
  ctx.drawImage(skylineTex, 0, 0);
  // rain over the skyline
  ctx.strokeStyle = "rgba(160,180,210,0.16)"; ctx.lineWidth = 1;
  ctx.beginPath();
  for (const d of rain) { ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 1.2, d.y - d.len); }
  ctx.stroke();
  // vignette
  const vg = ctx.createRadialGradient(W/2, H/2, H/3, W/2, H/2, H*0.85);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(0,0,0,0.6)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#e8dcc0";
  ctx.font = "bold 72px Georgia, serif";
  ctx.fillText("DEADHOUR", W/2, H*0.34);
  ctx.fillStyle = "rgba(200,210,230,0.55)";
  ctx.font = "italic 18px Georgia, serif";
  ctx.fillText("one night. one rampage. no witnesses.", W/2, H*0.34 + 36);
  ctx.fillStyle = "rgba(220,220,220,0.75)";
  ctx.font = "16px Georgia, serif";
  ctx.fillText("Press Enter", W/2, H*0.34 + 90);
}

function draw() {
  if (gameState === "title") { drawTitleScreen(); return; }
  ctx.save();
  const sx = (Math.random()-0.5)*shake, sy = (Math.random()-0.5)*shake;
  ctx.translate(sx, sy);

  // floor: painterly texture drawn from the pre-rendered canvas
  ctx.drawImage(floorTex, -10, -10, W+20, H+20);
  // faint checkerboard marble hint
  ctx.globalAlpha = 0.05;
  for (let y = 24; y < H-24; y += 40)
    for (let x = 24; x < W-24; x += 40)
      if (((x/40)+(y/40)) % 2 === 0) { ctx.fillStyle = "#aab"; ctx.fillRect(x, y, 40, 40); }
  ctx.globalAlpha = 1;

  // light pools: soft painterly glow + wet specular streak
  for (const L of lights) {
    const g = ctx.createRadialGradient(L.x, L.y, 10, L.x, L.y, L.r);
    g.addColorStop(0, L.color + "0.26)");
    g.addColorStop(0.5, L.color + "0.10)");
    g.addColorStop(1, L.color + "0)");
    ctx.fillStyle = g;
    ctx.fillRect(L.x - L.r, L.y - L.r, L.r*2, L.r*2);
    // hot core
    const core = ctx.createRadialGradient(L.x, L.y, 2, L.x, L.y, L.r*0.25);
    core.addColorStop(0, L.color + "0.30)");
    core.addColorStop(1, L.color + "0)");
    ctx.fillStyle = core;
    ctx.fillRect(L.x - L.r, L.y - L.r, L.r*2, L.r*2);
    // specular streak on wet floor
    ctx.fillStyle = L.color + "0.08)";
    ctx.fillRect(L.x - L.r/2, L.y - 5, L.r, 10);
  }

  // decals (blood)
  for (const d of decals) {
    ctx.fillStyle = "rgba(90,10,14,0.55)";
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); ctx.fill();
  }

  // walls & cover
  for (const w of walls) { ctx.fillStyle = "#15181f"; ctx.fillRect(w.x, w.y, w.w, w.h); }
  for (const c of covers) {
    ctx.fillStyle = "#1d2029"; ctx.fillRect(c.x, c.y, c.w, c.h);
    ctx.strokeStyle = "rgba(200,210,230,0.25)"; ctx.lineWidth = 2;
    ctx.strokeRect(c.x+1, c.y+1, c.w-2, c.h-2);
  }

  // pickups (painkillers)
  for (const p of pickups) {
    if (p.taken) continue;
    const g = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, 26);
    g.addColorStop(0, "rgba(255,255,255,0.5)");
    g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g; ctx.fillRect(p.x-26, p.y-26, 52, 52);
    ctx.fillStyle = "#eee";
    ctx.fillRect(p.x-5, p.y-8, 10, 16);
  }

  // enemies (dark silhouettes, red tie accent)
  for (const en of enemies) {
    if (en.hp <= 0) continue;
    ctx.fillStyle = "#101318";
    ctx.beginPath(); ctx.arc(en.x, en.y, en.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "rgba(200,210,230,0.5)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(en.x, en.y, en.r-1, 0, Math.PI*2); ctx.stroke();
    const a = Math.atan2(player.y - en.y, player.x - en.x);
    ctx.strokeStyle = "#0a0c10"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(en.x, en.y); ctx.lineTo(en.x + Math.cos(a)*18, en.y + Math.sin(a)*18); ctx.stroke();
    ctx.fillStyle = "#e03040"; // red tie
    ctx.beginPath(); ctx.arc(en.x, en.y, 4, 0, Math.PI*2); ctx.fill();
  }

  // player (light rim)
  {
    const p = player;
    ctx.fillStyle = "#0a0c10";
    ctx.beginPath(); ctx.arc(p.x, p.y, p.diving ? p.r*0.7 : p.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "rgba(220,230,255,0.9)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, (p.diving ? p.r*0.7 : p.r), 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = "#0a0c10"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + Math.cos(p.aimAngle)*20, p.y + Math.sin(p.aimAngle)*20); ctx.stroke();
    ctx.strokeStyle = "rgba(220,230,255,0.7)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + Math.cos(p.aimAngle)*20, p.y + Math.sin(p.aimAngle)*20); ctx.stroke();
  }

  // tracers
  for (const t of tracers) {
    ctx.strokeStyle = `rgba(255,240,210,${t.life/0.06})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(t.x1, t.y1); ctx.lineTo(t.x2, t.y2); ctx.stroke();
  }

  // particles
  for (const p of particles) {
    const a = p.life / p.maxLife;
    if (p.type === "flash") {
      ctx.fillStyle = `rgba(255,235,190,${a})`;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.angle);
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(26, -7); ctx.lineTo(34, 0); ctx.lineTo(26, 7); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if (p.type === "blood") {
      ctx.fillStyle = `rgba(150,20,26,${a})`;
      ctx.fillRect(p.x-1.5, p.y-1.5, 3, 3);
    } else if (p.type === "splash") {
      ctx.strokeStyle = `rgba(170,190,220,${a*0.5})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, (1-a)*8, 0, Math.PI*2); ctx.stroke();
    }
  }

  // rain
  ctx.strokeStyle = "rgba(160,180,210,0.18)"; ctx.lineWidth = 1;
  ctx.beginPath();
  for (const d of rain) { ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 1.2, d.y - d.len); }
  ctx.stroke();

  ctx.restore();

  // bullet-time filter: desaturated blue-grey + vignette
  if (timescale < 0.9) {
    ctx.fillStyle = `rgba(40,60,90,${(1-timescale)*0.25})`;
    ctx.fillRect(0, 0, W, H);
  }
  const vg = ctx.createRadialGradient(W/2, H/2, H/3, W/2, H/2, H*0.85);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, `rgba(0,0,0,${0.45 + (1-timescale)*0.25})`);
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  drawHUD();
  if (gameState !== "playing") drawEndScreen();
}

function drawHUD() {
  ctx.fillStyle = "rgba(10,12,16,0.7)";
  ctx.fillRect(16, H-64, 300, 48);
  ctx.strokeStyle = "rgba(200,190,160,0.4)"; ctx.lineWidth = 1;
  ctx.strokeRect(16.5, H-63.5, 299, 47);

  // bullet-time meter (amber)
  ctx.fillStyle = "#3a2f14";
  ctx.fillRect(24, H-56, 180, 10);
  ctx.fillStyle = "#e8a020";
  ctx.fillRect(24, H-56, 180 * player.btMeter, 10);

  // health
  ctx.fillStyle = "#2f1414";
  ctx.fillRect(24, H-40, 180, 10);
  ctx.fillStyle = "#c04848";
  ctx.fillRect(24, H-40, 180 * Math.max(0, player.hp) / player.maxHp, 10);

  // ammo
  ctx.fillStyle = "#ddd";
  ctx.font = "bold 20px Georgia, serif";
  ctx.textAlign = "right";
  ctx.fillText(player.reloading > 0 ? "RELOADING" : String(player.ammo), 300, H-42);

  ctx.font = "12px Georgia, serif";
  ctx.textAlign = "left";
  ctx.fillStyle = "rgba(220,220,220,0.5)";
  ctx.fillText("WASD move · mouse aim · LMB shoot · R reload · Space dive · Q/RMB bullet time", 20, H-8);
}

function drawEndScreen() {
  ctx.drawImage(skylineTex, 0, 0);
  ctx.fillStyle = "rgba(5,6,10,0.68)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = gameState === "win" ? "#e8dcc0" : "#c04848";
  ctx.font = "bold 54px Georgia, serif";
  ctx.fillText(gameState === "win" ? "THE ROOM IS QUIET" : "DEAD HOUR", W/2, H/2 - 10);
  ctx.fillStyle = "rgba(220,220,220,0.7)";
  ctx.font = "18px Georgia, serif";
  ctx.fillText("Press Enter to restart", W/2, H/2 + 40);
}

window.addEventListener("keydown", e => {
  if (e.code === "Enter" && gameState !== "playing") {
    gameState = "playing";
    player.hp = player.maxHp; player.ammo = player.mag; player.reloading = 0;
    player.btMeter = 1; player.diving = false;
    player.x = 120; player.y = 300;
    spawnLevel();
  }
});

// ---------- Main loop ----------
let last = performance.now();
function loop(now) {
  const rawDt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (gameState === "playing") update(rawDt);
  else {
    for (const d of rain) {
      d.y += d.speed * rawDt; d.x += 60 * rawDt;
      if (d.y > H) { d.y = -20; d.x = Math.random()*W; }
      if (d.x > W) d.x = 0;
    }
  }
  draw();
  requestAnimationFrame(loop);
}
spawnLevel();
requestAnimationFrame(loop);
</script>
</body>
</html>
